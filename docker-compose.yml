services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contextlm-postgres
    environment:
      POSTGRES_DB: contextlm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - contextlm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contextlm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  contextlm_pg_data:
